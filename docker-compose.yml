version: '3.4'

networks:
  hotel-booking-dev:
    driver: bridge

services:
  hotelservice.api:
    container_name: hotel-service
    build:
      context: .
      dockerfile: src/HotelService/HotelService.API/Dockerfile
    ports:
      - "5000:8080"
    networks:
      - hotel-booking-dev
    depends_on:
      - postgre_db
      - rabbitmq
      - redis

  bookingservice.api:
    container_name: booking-service
    build:
      context: .
      dockerfile: src/BookingService/BookingService.API/Dockerfile
    ports:
      - "5001:8080"
    networks:
      - hotel-booking-dev
    depends_on:
      - postgre_db
      - rabbitmq

  postgre_db:
    container_name: postgres-db
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: hotel-service, booking-service
    ports:
      - "5432:5432"
    networks:
      - hotel-booking-dev
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    container_name: redis-cache
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - hotel-booking-dev
    volumes:
      - redis-data:/data

  rabbitmq:
    container_name: rabbitmq-broker
    image: rabbitmq:4.0-management
    hostname: "bookings-queue"
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - hotel-booking-dev
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data: